spring.application.name=aluguel-carros
server.port=${SERVER_PORT:8080}

# Supabase (PostgreSQL) - ver .env.example
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
server.error.include-message=always

# Apply the idempotent compatibility migration before Hibernate validates/updates
# an existing database. Hibernate update cannot add NOT NULL columns to populated tables.
spring.sql.init.mode=always

# Segurança: chave para cadastro de agentes (EMPRESA/BANCO).
# Defina via variável de ambiente AGENT_REGISTRATION_KEY.
app.security.agent-registration-key=${AGENT_REGISTRATION_KEY:}
